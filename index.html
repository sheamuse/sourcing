<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>신상품 소싱 보드</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #F2F3F1;
  --surface: #FFFFFF;
  --surface-2: #F7F8F6;
  --ink: #17201D;
  --muted: #66706C;
  --line: #DDE1DC;
  --line-strong: #C6CCC6;
  --accent: #2346C8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7ECFB;
  --danger: #A1342B;

  --review: #8A5D00;  --review-bg: #FBF0D6;
  --picked: #146B44;  --picked-bg: #DCF1E5;
  --hold: #55605B;    --hold-bg: #E6E9E6;
  --drop: #A1342B;    --drop-bg: #F8E1DE;

  --radius: 12px;
  --radius-sm: 7px;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111513;
    --surface: #191E1C;
    --surface-2: #1F2523;
    --ink: #E8ECE9;
    --muted: #99A29E;
    --line: #2B3230;
    --line-strong: #3B4440;
    --accent: #8098FF;
    --accent-ink: #0D1433;
    --accent-soft: #222B4C;
    --danger: #F08F86;
    --review: #E8B95C;  --review-bg: #392E16;
    --picked: #72D3A2;  --picked-bg: #163428;
    --hold: #B4BCB8;    --hold-bg: #29302D;
    --drop: #F08F86;    --drop-bg: #3B1F1C;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); }
.spacer { flex: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 14px;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap;
  cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.small { height: 32px; padding: 0 10px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: progress; }

input[type=text], input[type=search], input[type=password], input[type=number], input[type=url],
input:not([type]), select, textarea {
  width: 100%;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface); padding: 9px 11px; font-size: 14px; font-weight: 400;
}
select { padding-right: 28px; }
textarea { resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- login ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login-card {
  width: min(360px, 100%); background: var(--surface);
  border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px;
  display: grid; gap: 12px;
}
.login-mark { font-size: 32px; }
.login-card h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
.login-card p { margin: 0; }
.login-error { color: var(--danger); font-size: 13px; min-height: 1.2em; }

/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px clamp(16px, 4vw, 40px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; text-decoration: none; letter-spacing: -0.01em; }
.brand-mark { font-size: 18px; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.usage { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.usage-bar { width: 72px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.usage-bar i { display: block; height: 100%; background: var(--accent); }

.view { max-width: 1240px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 80px; }

/* ---------- list ---------- */
.list-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.list-head h1 { margin: 0; font-size: 28px; letter-spacing: -0.025em; line-height: 1.2; }
.list-head p { margin: 4px 0 0; color: var(--muted); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); overflow-x: auto; }
.tabs button {
  border: 0; background: transparent; border-radius: 7px; padding: 6px 12px;
  font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.tabs button[aria-selected=true] { background: var(--ink); color: var(--surface); }
.tabs .count { font-size: 12px; font-weight: 500; opacity: .75; font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 8px; flex: 1; justify-content: flex-end; min-width: 280px; }
.filters input { max-width: 260px; }
.filters select { width: auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.card:hover { border-color: var(--line-strong); }
.card:hover h3 { text-decoration: underline; text-underline-offset: 3px; }
.thumb { aspect-ratio: 4 / 3; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; border-bottom: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.noimg { font-size: 13px; color: var(--muted); }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card-body h3 { margin: 0; font-size: 17px; letter-spacing: -0.015em; line-height: 1.35; }
.excerpt { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-foot strong { color: var(--ink); font-weight: 600; }

.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.s-review { color: var(--review); background: var(--review-bg); }
.s-picked { color: var(--picked); background: var(--picked-bg); }
.s-hold   { color: var(--hold);   background: var(--hold-bg); }
.s-drop   { color: var(--drop);   background: var(--drop-bg); }
.prio { font-size: 12px; font-weight: 700; color: var(--accent); }

.empty { text-align: center; padding: 72px 20px; border: 1px dashed var(--line-strong); border-radius: var(--radius); background: var(--surface); }
.empty h2 { margin: 0 0 6px; font-size: 18px; }
.empty p { margin: 0 0 18px; color: var(--muted); }

/* ---------- detail ---------- */
.crumb { margin-bottom: 14px; font-size: 14px; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--ink); }
.detail-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
.detail-head h1 { margin: 8px 0 0; font-size: clamp(24px, 3.2vw, 32px); letter-spacing: -0.03em; line-height: 1.2; }
.head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.head-actions select { width: auto; height: 38px; padding-top: 0; padding-bottom: 0; font-weight: 600; }

.detail-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .detail-grid { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

.gallery { padding: 12px; }
.gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gallery-grid .shot:first-child { grid-column: 1 / -1; aspect-ratio: 1 / 1; }
.shot { position: relative; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.shot > button.open { all: unset; cursor: zoom-in; display: block; width: 100%; height: 100%; }
.shot img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.shot .img-copy {
  position: absolute; right: 6px; bottom: 6px;
  border: 0; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 600;
  background: rgba(23, 32, 29, .78); color: #fff; cursor: pointer; opacity: 0;
}
.shot:hover .img-copy, .shot:focus-within .img-copy { opacity: 1; }
@media (hover: none) { .shot .img-copy { opacity: 1; } }
.gallery-empty { aspect-ratio: 4 / 3; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 14px; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 20px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }
kbd { font-family: inherit; font-size: 11.5px; padding: 1px 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.facts > div { padding: 16px 18px; }
.facts > div + div { border-left: 1px solid var(--line); }
.facts span { display: block; font-size: 12.5px; color: var(--muted); }
.facts strong { display: block; margin-top: 2px; font-size: 20px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.facts strong.good { color: var(--picked); }
.facts strong.bad { color: var(--drop); }

.note { padding: 18px 20px; }
.note + .note { border-top: 1px solid var(--line); }
.note h2 { margin: 0 0 6px; font-size: 14px; font-weight: 700; color: var(--muted); }
.prose { max-width: 68ch; white-space: normal; }
.prose.lead { font-size: 16.5px; line-height: 1.7; }
.prose .placeholder { color: var(--muted); font-style: normal; }

/* ---------- compare ---------- */
.compare { margin-top: 40px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.section-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
.section-head h2 span { font-weight: 500; color: var(--muted); font-size: 15px; margin-left: 4px; }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table.cmp { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 880px; }
.cmp td.rating { white-space: nowrap; font-size: 13px; color: var(--muted); }
.cmp th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.cmp td { padding: 12px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.cmp tr:last-child td { border-bottom: 0; }
.cmp .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cmp tr.selected td { background: var(--accent-soft); }
.cmp tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.site { font-weight: 700; white-space: nowrap; }
.tag { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.tag.best { color: var(--picked); background: var(--picked-bg); }
.tag.chosen { color: var(--accent-ink); background: var(--accent); }
.prod { display: flex; align-items: center; gap: 10px; min-width: 190px; }
.prod img, .prod .ph { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; border: 1px solid var(--line); background: var(--surface-2); }
.prod-name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
.prod a.link { font-size: 12.5px; color: var(--accent); text-decoration: none; }
.prod a.link:hover { text-decoration: underline; }

/* the landed-cost bar: the one thing the eye should land on */
.cost { min-width: 130px; }
.cost-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.cost-bar { height: 6px; margin-top: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.cost-bar i { display: block; height: 100%; background: var(--line-strong); border-radius: 3px; }
tr.best .cost-bar i { background: var(--picked); }
tr.selected .cost-bar i { background: var(--accent); }
.margin.good { color: var(--picked); font-weight: 600; }
.margin.bad { color: var(--drop); font-weight: 600; }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; }

.src-cards { align-items: start; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; margin-top: 16px; }
.src-card { padding: 16px 18px; }
.src-card header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.src-card h3 { margin: 0; font-size: 15px; }
.src-card h3 small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; font-size: 14px; }
.pc h4 { margin: 0 0 3px; font-size: 12.5px; }
.pc .pro h4 { color: var(--picked); }
.pc .con h4 { color: var(--drop); }
.src-memo { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
.src-shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; margin-top: 12px; }

/* ---------- modal ---------- */
.modal {
  width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
  padding: 0; border: 1px solid var(--line); border-radius: 16px;
  background: var(--surface); color: var(--ink);
}
.modal::backdrop, .lightbox::backdrop { background: rgba(10, 14, 12, .5); }
.modal form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
.icon-btn { border: 0; background: transparent; font-size: 18px; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.modal-body { padding: 18px 22px; overflow-y: auto; display: grid; gap: 14px; }
.modal-foot { display: flex; align-items: center; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 16px 16px; }
.modal label, .field { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
.modal label small, .field small { font-weight: 400; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 600px) { .row2, .row3, .row4 { grid-template-columns: 1fr 1fr; } .pc { grid-template-columns: 1fr; } }
.check { display: flex !important; grid-template-columns: none; align-items: center; gap: 8px; font-weight: 600; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* uploader */
.drop {
  border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 18px;
  text-align: center; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; background: var(--surface-2);
}
.drop strong { color: var(--ink); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.up-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 10px; }
.up-thumb { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.up-thumb img { aspect-ratio: 1 / 1; width: 100%; object-fit: contain; }
.up-thumb .cap { font-size: 11px; font-weight: 500; color: var(--muted); padding: 4px 6px; background: var(--surface); border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.up-thumb .cap.main { color: var(--accent); font-weight: 700; }
.up-thumb .x, .up-thumb .star {
  position: absolute; top: 4px; border: 0; width: 24px; height: 24px; border-radius: 6px;
  background: rgba(23, 32, 29, .72); color: #fff; font-size: 13px; cursor: pointer; line-height: 1;
}
.up-thumb .x { right: 4px; }
.up-thumb .star { left: 4px; }
.up-thumb.busy img { opacity: .35; }
.up-thumb.busy::after { content: "압축 중"; position: absolute; inset: 0 0 24px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); }

/* lightbox */
.lightbox { padding: 0; border: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; }
.lb { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
.lb img { max-width: min(1100px, 100%); max-height: calc(100vh - 110px); object-fit: contain; background: #fff; border-radius: 8px; }
.lb-bar { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 10px; padding: 6px 6px 6px 14px; color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
.lb-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); font-size: 20px; cursor: pointer; }
.lb-nav.prev { left: 16px; }
.lb-nav.next { right: 16px; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px;
  font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: calc(100vw - 32px); z-index: 100;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--danger); color: #fff; }

.loading { padding: 80px 0; text-align: center; color: var(--muted); }

@media (max-width: 640px) {
  .list-head { flex-direction: column; align-items: stretch; }
  .filters { min-width: 0; flex-wrap: wrap; }
  .filters input { max-width: none; }
  .usage span:last-child { display: none; }
  .facts strong { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* =========================================================
   v2: 사이드바 트리 · 계산기 · 문서 · 사용자
   ========================================================= */
:root { --topbar-h: 56px; --side-w: 272px; --calc-w: 384px; }
.topbar { height: var(--topbar-h); padding-top: 0; padding-bottom: 0; }
.topbar-left { display: flex; align-items: center; gap: 6px; }
.side-toggle { display: none; }
.view { max-width: 1180px; min-width: 0; width: 100%; }

.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); transition: margin-right .2s; }
body.calc-open .shell { margin-right: var(--calc-w); }
@media (max-width: 1180px) { body.calc-open .shell { margin-right: 0; } }

/* sidebar */
.sidebar {
  position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto;
  border-right: 1px solid var(--line); padding: 14px 10px 40px; background: var(--bg);
}
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 8px 12px; }
.side-head h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); }
.side-add { width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink); }
.side-add:hover { background: var(--surface-2); }
.tree-all { margin-bottom: 4px; }
.tree-row {
  position: relative; display: flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 0 4px 0 calc(10px + var(--depth, 0) * 18px);

  const fmtNum = (n, d = 2) => Number(n).toLocaleString('ko-KR', { maximumFractionDigits: d });
  const won = (n) => (n === null || n === undefined || n === '' || Number.isNaN(+n)) ? '-' : Math.round(n).toLocaleString('ko-KR') + '원';
  const yuan = (n) => (n === null || n === undefined || n === '') ? '-' : '¥' + fmtNum(n, 2);
  const size = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB';
  const totalCost = (s) => (s.unit_price == null && s.shipping_fee == null) ? null : (s.unit_price || 0) + (s.shipping_fee || 0);
  const marginPct = (target, cost) => (target && cost != null) ? Math.round(((target - cost) / target) * 1000) / 10 : null;
  const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const guessSite = (url) => { const h = hostOf(url); const hit = SITE_HOSTS.find(([re]) => re.test(h)); return hit ? hit[1] : ''; };
  const normUrl = (u) => { u = (u || '').trim(); if (!u) return null; return /^https?:\/\//i.test(u) ? u : 'https://' + u; };
  const numOrNull = (v) => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/,/g, '')); return Number.isFinite(n) ? Math.round(n) : null; };
  const decOrNull = (v) => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/,/g, '')); return Number.isFinite(n) ? n : null; };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const uid = () => (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));

    if (d < 60) return '방금';
    if (d < 3600) return Math.floor(d / 60) + '분 전';
    if (d < 86400) return Math.floor(d / 3600) + '시간 전';
    if (d < 86400 * 7) return Math.floor(d / 86400) + '일 전';
    const t = new Date(ts);
    return `${t.getFullYear() % 100}.${t.getMonth() + 1}.${t.getDate()}`;
  }

  /* =========================================================
     계산식 엔진 (안전한 사칙연산 파서)
     ========================================================= */
  const VAR_ALIASES = { '위안화': 'cny', '위안': 'cny', 'cny': 'cny', 'CNY': 'cny', '환율': 'rate', 'rate': 'rate' };
  const NUM_RE = /^(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?|^\.\d+/;

  function tokenize(src) {
    const s = String(src || '').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    const out = [];
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      const rest = s.slice(i);
      const num = NUM_RE.exec(rest);
      if (num) { out.push({ t: 'num', v: parseFloat(num[0].replace(/,/g, '')) }); i += num[0].length; continue; }
      if ('+-*/()'.includes(ch)) { out.push({ t: 'op', v: ch }); i++; continue; }
      const id = /^[A-Za-z가-힣_]+/.exec(rest);
      if (id) {
        const key = VAR_ALIASES[id[0]];
        if (!key) throw new Error(`'${id[0]}'은(는) 쓸 수 없습니다. '위안'과 '환율'만 쓸 수 있어요.`);
        out.push({ t: 'var', v: key }); i += id[0].length; continue;
      }
      throw new Error(`'${ch}' 기호는 쓸 수 없습니다.`);
    }
    return out;
  }

  function compile(src) {
    const toks = tokenize(src);
    let p = 0;
    const peek = () => toks[p];
    const isOp = (...ops) => peek() && peek().t === 'op' && ops.includes(peek().v);
    function expr() {
      let n = term();
      while (isOp('+', '-')) { const o = toks[p++].v, l = n, r = term(); n = o === '+' ? (v) => l(v) + r(v) : (v) => l(v) - r(v); }
      return n;
    }
    function term() {
      let n = factor();
      while (isOp('*', '/')) { const o = toks[p++].v, l = n, r = factor(); n = o === '*' ? (v) => l(v) * r(v) : (v) => l(v) / r(v); }
      return n;
    }
    function factor() {
      const t = toks[p++];
      if (!t) throw new Error('식이 중간에 끝났습니다.');
      if (t.t === 'num') { const val = t.v; return () => val; }
      if (t.t === 'var') { const k = t.v; return (v) => v[k]; }
      if (t.t === 'op' && t.v === '-') { const f = factor(); return (v) => -f(v); }
      if (t.t === 'op' && t.v === '+') return factor();
      if (t.t === 'op' && t.v === '(') {
        const e = expr();
        const c = toks[p++];
        if (!c || c.v !== ')') throw new Error('괄호가 닫히지 않았습니다.');
        return e;
      }
      throw new Error(`'${t.v}' 위치를 확인해 주세요.`);
    }
    if (!toks.length) throw new Error('계산법이 비어 있습니다.');
    const fn = expr();
    if (p < toks.length) throw new Error(`'${toks[p].v}' 근처를 확인해 주세요.`);
    if (!toks.some((t) => t.t === 'var' && t.v === 'cny')) throw new Error('계산법에 "위안"이 들어가야 합니다.');
    return fn;
  }

  function explainFormula(src, cny, rate) {
    return String(src)
      .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
      .replace(/(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?/g, (m) => fmtNum(parseFloat(m.replace(/,/g, '')), 4))
      .replace(/위안화|위안|CNY|cny/g, () => fmtNum(cny, 2))
      .replace(/환율|rate/g, () => fmtNum(rate, 2))
      .replace(/\s*\*\s*/g, ' × ').replace(/\s*\/\s*/g, ' ÷ ')
      .replace(/\s*\+\s*/g, ' + ').replace(/(\S)\s*-\s*/g, '$1 − ')
      .replace(/\(\s+/g, '(').replace(/\s+\)/g, ')').replace(/\s+/g, ' ').trim();
  }

  const ROUND_MODES = { round: '반올림', ceil: '올림', floor: '내림' };
  function roundBy(v, unit, mode) {
    const u = Number(unit) || 1;
    const f = mode === 'ceil' ? Math.ceil : mode === 'floor' ? Math.floor : Math.round;
    return f(v / u) * u;
  }
  const roundLabel = (c) => `${Number(c.round_unit) > 1 ? fmtNum(c.round_unit, 0) + '원' : '원'} 단위 ${ROUND_MODES[c.round_mode] || '반올림'}`;

  /** 위안 금액 → 최종금액. calc 설정과 환율을 받아 적용 과정을 글로 돌려준다 */
  function calcPrice(cny, calc = state.settings.calc, rate = currentRate()) {
    if (cny == null || cny === '' || !Number.isFinite(+cny)) return null;
    if (!rate) throw new Error('환율을 아직 불러오지 못했습니다. 계산기에서 수동 환율을 넣어 주세요.');
    const fn = compile(calc.formula);
    const raw = fn({ cny: +cny, rate: +rate });
    if (!Number.isFinite(raw)) throw new Error('계산 결과가 올바르지 않습니다. 계산법을 확인해 주세요.');
    const final = roundBy(raw, calc.round_unit, calc.round_mode);
    const expr = explainFormula(calc.formula, +cny, +rate);
    const text = `${expr} = ${fmtNum(raw, 2)}원 → ${fmtNum(final, 0)}원 (${roundLabel(calc)}, 환율 ${fmtNum(rate, 2)})`;
    return { raw, final, rate: +rate, formula: calc.formula, text, krw: Math.round(cny * rate) };
  }

  const rate = { value: null, source: '', at: null, fetched: 0, loading: false, error: null };

    return `${rate.source} · ${fmtTime(rate.at || rate.fetched)} 기준 · ${ago(rate.fetched)} 확인`;
  }

  async function fetchRate(force = false) {
    const cached = ls.get('sb_rate', null);
    if (!force && cached && cached.value && Date.now() - cached.fetched < 30 * 60 * 1000) {
      Object.assign(rate, cached, { error: null });
      onRateChange();
      return;
    }
    rate.loading = true;
    onRateChange();
    const getJSON = async (u) => { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); };
    const providers = [
      ['open.er-api.com', async () => { const j = await getJSON('https://open.er-api.com/v6/latest/CNY'); if (j.result !== 'success') throw 0; return { value: j.rates.KRW, at: j.time_last_update_unix * 1000 }; }],
      ['currency-api', async () => { const j = await getJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/cny.json'); return { value: j.cny.krw, at: new Date(j.date).getTime() }; }],
      ['frankfurter.app', async () => { const j = await getJSON('https://api.frankfurter.app/latest?from=CNY&to=KRW'); return { value: j.rates.KRW, at: new Date(j.date).getTime() }; }]
    ];
    let ok = false;
    for (const [name, fn] of providers) {
      try {
        const r = await fn();
        if (r.value > 0) {
          Object.assign(rate, { value: r.value, source: name, at: r.at, fetched: Date.now(), error: null });
          ls.set('sb_rate', { value: rate.value, source: name, at: r.at, fetched: rate.fetched });
          ok = true;
          break;
        }
      } catch { /* 다음 제공처 시도 */ }
    }
    if (!ok) {
      if (cached && cached.value) Object.assign(rate, cached);
      rate.error = '환율을 새로 불러오지 못했습니다.' + (rate.value ? ' 마지막으로 받은 환율을 사용합니다.' : ' 수동 환율을 입력해 주세요.');
    }
    rate.loading = false;
    onRateChange();
  }

  async function loadAll() {
    const [c, s, f, st] = await Promise.all([
      sb.from('candidates').select('*').order('created_at', { ascending: false }),
      sb.from('sources').select('*').order('created_at', { ascending: true }),
      sb.from('folders').select('*'),
      sb.from('settings').select('*')

    const err = c.error || s.error || f.error || st.error;
    if (err) {
      const needMigrate = /folders|settings|column|does not exist|schema cache/i.test(err.message);
      view.innerHTML = `<div class="empty"><h2>${needMigrate ? '데이터베이스 업데이트가 필요합니다' : '데이터를 불러오지 못했습니다'}</h2>

      return false;
    }
    state.candidates = c.data || [];
    state.sources = s.data || [];
    state.folders = f.data || [];
    (st.data || []).forEach((r) => {
      state.settings[r.key] = r.value;
      state.settingsMeta[r.key] = { by: r.updated_by, at: r.updated_at };
    });
    state.settings.calc = { ...DEFAULT_CALC, ...(state.settings.calc || {}) };
    if (!Array.isArray(state.settings.members)) state.settings.members = [];
    return true;
  }

  async function saveSetting(key, value) {
    const { error } = await sb.from('settings').upsert({ key, value, updated_by: me });
    if (error) throw error;
    state.settings[key] = value;
    state.settingsMeta[key] = { by: me, at: new Date().toISOString() };
  }

  const sourcesOf = (id) => state.sources.filter((s) => s.candidate_id === id);
  const coverOf = (c) => (c.images && c.images[0]) || sourcesOf(c.id).flatMap((s) => s.images || [])[0] || null;
  const bestCostOf = (id) => {
    const srcs = sourcesOf(id);
    const chosen = srcs.find((s) => s.is_selected);
    if (chosen && totalCost(chosen) != null) return { cost: totalCost(chosen), chosen: true };
    const costs = srcs.map(totalCost).filter((v) => v != null);
    return costs.length ? { cost: Math.min(...costs), chosen: false } : null;
  };
  const docPaths = (html) => [...String(html || '').matchAll(/data-path="([^"]+)"/g)].map((m) => m[1]);

  /* ---------- 폴더 트리 헬퍼 ---------- */
  const bySort = (a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0) || String(a.created_at).localeCompare(String(b.created_at));
  const folderById = (id) => state.folders.find((f) => f.id === id);
  const childFolders = (pid) => state.folders.filter((f) => (f.parent_id || null) === (pid || null)).sort(bySort);
  const childItems = (fid) => state.candidates.filter((c) => (folderById(c.folder_id) ? c.folder_id : null) === (fid || null)).sort(bySort);
  function descendantFolderIds(id) {
    const out = new Set([id]);
    let grew = true;
    while (grew) {
      grew = false;
      state.folders.forEach((f) => { if (f.parent_id && out.has(f.parent_id) && !out.has(f.id)) { out.add(f.id); grew = true; } });
    }
    return out;
  }
  const itemsUnder = (fid) => { const ids = descendantFolderIds(fid); return state.candidates.filter((c) => ids.has(c.folder_id)); };
  function folderPath(fid) {
    const path = [];
    let f = folderById(fid);
    const seen = new Set();
    while (f && !seen.has(f.id)) { seen.add(f.id); path.unshift(f); f = folderById(f.parent_id); }
    return path;
  }
  function folderOptions(selected, excludeIds = new Set()) {
    const out = [`<option value="">(최상위)</option>`];
    const walk = (pid, depth) => childFolders(pid).forEach((f) => {
      if (excludeIds.has(f.id)) return;
      out.push(`<option value="${f.id}" ${f.id === selected ? 'selected' : ''}>${'　'.repeat(depth)}${esc(f.emoji || '📁')} ${esc(f.name)}</option>`);
      walk(f.id, depth + 1);
    });
    walk(null, 0);
    return out.join('');
  }

  /* =========================================================
     이미지: 서명 URL 캐시 · 업로드 · 압축
     ========================================================= */
  const urlCache = new Map();
  const URL_TTL = 60 * 60 * 6;

  async function ensureUrls(paths) {
    const now = Date.now();
    const need = [...new Set(paths.filter(Boolean))].filter((p) => !(urlCache.get(p)?.exp > now + 60000));
    for (let i = 0; i < need.length; i += 100) {
      const chunk = need.slice(i, i + 100);
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(chunk, URL_TTL);
      if (error) { console.warn(error); continue; }
      data.forEach((d) => { if (d.signedUrl) urlCache.set(d.path, { url: d.signedUrl, exp: now + URL_TTL * 1000 }); });
    }
  }
  const imgUrl = (p) => urlCache.get(p)?.url || '';

  async function removeFiles(paths) {
    const list = [...new Set((paths || []).filter(Boolean))];
    if (!list.length) return;
    const { error } = await sb.storage.from(BUCKET).remove(list);
    if (error) console.warn('이미지 삭제 실패', error);
    list.forEach((p) => urlCache.delete(p));
    refreshUsage();
  }

  async function refreshUsage() {
    let total = 0, count = 0, offset = 0;
    for (;;) {
      const { data, error } = await sb.storage.from(BUCKET).list('img', { limit: 1000, offset });
      if (error || !data) break;
      data.forEach((o) => { if (o.metadata?.size) { total += o.metadata.size; count++; } });
      if (data.length < 1000) break;
      offset += 1000;
    }
    const pct = Math.min(100, (total / STORAGE_LIMIT) * 100);
    $('#usage').innerHTML = `
      <span class="usage-bar" aria-hidden="true"><i style="width:${Math.max(pct, total ? 1 : 0)}%"></i></span>
      <span>이미지 ${count}장 · ${size(total)} / 1GB</span>`;
  }

  async function loadBitmap(blob) {
    if ('createImageBitmap' in window) {
      try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch { /* fall through */ }
    }
    return await new Promise((res, rej) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽을 수 없습니다')); };
      img.src = url;
    });
  }
  const canvasToBlob = (canvas, type, q) => new Promise((res) => canvas.toBlob(res, type, q));

  async function compressImage(file) {
    const bmp = await loadBitmap(file);
    const w0 = bmp.width, h0 = bmp.height;
    let maxSide = MAX_SIDE, quality = 0.82, blob = null;
    for (let i = 0; i < 10; i++) {
      const scale = Math.min(1, maxSide / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(bmp, 0, 0, w, h);
      blob = await canvasToBlob(c, 'image/webp', quality);
      if (!blob || blob.type !== 'image/webp') blob = await canvasToBlob(c, 'image/jpeg', quality);
      if (blob.size <= TARGET_BYTES) break;
      if (quality > 0.6) quality -= 0.08; else maxSide = Math.round(maxSide * 0.82);
    }
    if (bmp.close) bmp.close();
    return blob;
  }

  async function uploadBlob(blob) {
    const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
    const path = `img/${uid()}.${ext}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type, cacheControl: '31536000', upsert: false });
    if (error) throw error;
    return path;
  }

  function imageFilesFrom(dataTransfer) {
    if (!dataTransfer) return [];
    const out = [];
    for (const item of dataTransfer.items || []) {
      if (item.kind === 'file' && item.type.startsWith('image/')) { const f = item.getAsFile(); if (f) out.push(f); }
    }
    if (!out.length && dataTransfer.files) for (const f of dataTransfer.files) if (f.type.startsWith('image/')) out.push(f);
    return out;
  }

  async function copyImage(path, directUrl) {
    const url = directUrl || imgUrl(path);
    if (!url || !navigator.clipboard || !window.ClipboardItem) {
      toast('이 브라우저는 이미지 복사를 지원하지 않습니다. 이미지를 우클릭해 복사해 주세요.', true);
      return;
    }
    try {
      const png = fetch(url).then((r) => r.blob()).then(async (b) => {
        const bmp = await loadBitmap(b);
        const c = document.createElement('canvas');
        c.width = bmp.width; c.height = bmp.height;
        c.getContext('2d').drawImage(bmp, 0, 0);
        return canvasToBlob(c, 'image/png');
      });
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
      toast('이미지를 복사했습니다. 원하는 곳에 붙여넣으세요.');
    } catch (err) {
      console.warn(err);
      toast('이미지를 복사하지 못했습니다. 이미지를 우클릭해 복사해 주세요.', true);
    }
  }

  /* =========================================================
     업로더 (붙여넣기 / 끌어놓기 / 파일 선택)
     ========================================================= */
  function createUploader(root, initialPaths = []) {
    let items = initialPaths.map((p) => ({ path: p, url: imgUrl(p) }));
    const removed = [];
    const uploaded = [];

    root.innerHTML = `
      <div class="drop" tabindex="0" role="button" aria-label="이미지 추가">
        <strong>Ctrl+V로 붙여넣기</strong>, 끌어다 놓기, 또는 클릭해서 파일 선택
        <input type="file" accept="image/*" multiple hidden>
      </div>
      <div class="up-thumbs"></div>
      <p class="hint">올리기 전에 자동으로 압축됩니다 (긴 변 ${MAX_SIDE}px, 장당 약 ${Math.round(TARGET_BYTES / 1024)}KB 이하). 첫 번째 이미지가 대표 이미지입니다.</p>`;
    const drop = root.querySelector('.drop');
    const input = root.querySelector('input');
    const thumbs = root.querySelector('.up-thumbs');

    function render() {
      thumbs.innerHTML = items.map((it, i) => `
        <div class="up-thumb ${it.busy ? 'busy' : ''}">
          ${it.url ? `<img src="${esc(it.url)}" alt="">` : '<img alt="">'}
          ${i > 0 && !it.busy ? `<button type="button" class="star" data-i="${i}" title="대표 이미지로">★</button>` : ''}
          ${!it.busy ? `<button type="button" class="x" data-i="${i}" title="빼기" aria-label="이미지 빼기">✕</button>` : ''}
          <div class="cap ${i === 0 ? 'main' : ''}">${i === 0 ? '대표 · ' : ''}${it.blob ? `${size(it.orig)} → ${size(it.blob.size)}` : '저장됨'}</div>
        </div>`).join('');
    }

    thumbs.addEventListener('click', (e) => {
      const x = e.target.closest('.x'), star = e.target.closest('.star');
      if (x) {
        const [it] = items.splice(+x.dataset.i, 1);
        if (it.path) removed.push(it.path);
        if (it.blob && it.url) URL.revokeObjectURL(it.url);
        render();
      } else if (star) {
        const [it] = items.splice(+star.dataset.i, 1);
        items.unshift(it);
        render();
      }
    });

    async function addFiles(files) {
      for (const f of files) {
        if (!f.type.startsWith('image/')) continue;
        const it = { busy: true, orig: f.size };
        items.push(it);
        render();
        try {
          const blob = await compressImage(f);
          it.blob = blob;
          it.url = URL.createObjectURL(blob);
          it.busy = false;
        } catch (err) {
          items = items.filter((x) => x !== it);
          toast('이미지를 읽지 못했습니다: ' + err.message, true);
        }
        render();
      }
    }

    drop.addEventListener('click', () => input.click());
    drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    input.addEventListener('change', () => { addFiles([...input.files]); input.value = ''; });
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(imageFilesFrom(e.dataTransfer)); });

    render();

    return {
      addFiles,
      busy: () => items.some((i) => i.busy),
      removed: () => removed,
      uploaded: () => uploaded,
      async commit() {
        for (const it of items) {
          if (it.blob && !it.path) {
            it.path = await uploadBlob(it.blob);
            uploaded.push(it.path);
          }
        }
        return items.map((i) => i.path);
      },
      dispose() { items.forEach((i) => { if (i.blob && i.url) URL.revokeObjectURL(i.url); }); }
    };
  }

  // 전역 Ctrl+V: 모달 업로더 → 요약 탭 이미지 (문서 편집기는 자체 처리)
  document.addEventListener('paste', async (e) => {
    if (e.target.closest && e.target.closest('.doc-editor')) return;
    if (mini.open) return;
    const files = imageFilesFrom(e.clipboardData);
    const html = e.clipboardData?.getData('text/html') || '';
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
    if (!files.length) {
      const inContext = (modal.open && activeUploader) || (!modal.open && currentDetailId() && state.tab === 'info');
      if (inContext && /<img/i.test(html) && !typing) {
        toast('글과 함께 복사된 이미지는 가져올 수 없습니다. 이미지를 우클릭 → "이미지 복사" 후 붙여넣어 주세요.', true);
      }
      return;
    }
    if (modal.open && activeUploader) { e.preventDefault(); activeUploader.addFiles(files); return; }
    const id = currentDetailId();
    if (id && !lightbox.open && !modal.open) {
      e.preventDefault();
      if (state.tab === 'doc' && docCtx) { insertDocImages(files, true); return; }
      await quickAddImages(id, files);
    }
  });

  async function quickAddImages(id, files) {
    const c = state.candidates.find((x) => x.id === id);
    if (!c) return;
    toast(`이미지 ${files.length}장 압축 중…`);
    try {
      let orig = 0, after = 0;
      const paths = [];
      for (const f of files) {
        const blob = await compressImage(f);
        orig += f.size; after += blob.size;
        paths.push(await uploadBlob(blob));
      }
      const images = [...(c.images || []), ...paths];
      const { error } = await sb.from('candidates').update({ images, ...stampUpd() }).eq('id', id);
      if (error) { await removeFiles(paths); throw error; }
      c.images = images;
      c.updated_by = me;
      toast(`이미지 ${paths.length}장 추가됨 (${size(orig)} → ${size(after)})`);
      if (state.tab !== 'info') state.tab = 'info';
      await renderDetail(id);
      refreshUsage();
    } catch (err) {
      toast('이미지를 추가하지 못했습니다: ' + err.message, true);
    }
  }

  /* =========================================================
     작은 대화상자 (이름 입력, 아이콘, 폴더 선택, 사용자)
     ========================================================= */
  function miniDialog(html, { forced = false, onOpen } = {}) {
    return new Promise((resolve) => {
      mini.innerHTML = html;
      let result = null;
      const form = mini.querySelector('form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        result = form._result ? form._result() : Object.fromEntries(new FormData(form));
        if (result === false) { result = null; return; }
        mini.close();
      });
      mini.querySelectorAll('[data-mini-close]').forEach((b) => b.addEventListener('click', () => mini.close()));
      const onCancel = (e) => { if (forced) e.preventDefault(); };
      mini.addEventListener('cancel', onCancel);
      mini.addEventListener('close', function done() {
        mini.removeEventListener('close', done);
        mini.removeEventListener('cancel', onCancel);
        resolve(result);
      });
      mini.showModal();
      if (onOpen) onOpen(form, (r) => { result = r; mini.close(); });
      const first = form.querySelector('input:not([type=hidden]), select');
      if (first) { first.focus(); if (first.select) first.select(); }
    });
  }

  async function askText(title, label, value = '', placeholder = '') {
    const r = await miniDialog(`
      <form>
        <h2>${esc(title)}</h2>
        <label class="field">${esc(label)}<input name="v" value="${esc(value)}" placeholder="${esc(placeholder)}" required maxlength="120"></label>
        <div class="actions"><button type="button" class="btn" data-mini-close>취소</button><button class="btn primary">확인</button></div>
      </form>`);
    const v = r?.v?.trim();
    return v || null;
  }

  async function askEmoji(current) {
    const r = await miniDialog(`
      <form>
        <h2>아이콘 고르기</h2>
        <div class="emoji-grid">${EMOJIS.map((e) => `<button type="button" data-e="${e}" class="${e === current ? 'on' : ''}">${e}</button>`).join('')}</div>
        <label class="field">직접 입력 <small>(Windows: 윈도우키 + . 으로 이모지 창 열기)</small><input name="v" value="${esc(current || '')}" maxlength="8"></label>
        <div class="actions">
          <button type="button" class="btn ghost" data-clear>기본 아이콘</button>
          <span class="spacer"></span>
          <button type="button" class="btn" data-mini-close>취소</button><button class="btn primary">확인</button>
        </div>
      </form>`, {
      onOpen(form, finish) {
        form.querySelector('.emoji-grid').addEventListener('click', (e) => {
          const b = e.target.closest('[data-e]'); if (b) finish({ v: b.dataset.e });
        });
        form.querySelector('[data-clear]').addEventListener('click', () => finish({ v: '' }));
      }
    });
    if (!r) return undefined;
    return (r.v || '').trim();
  }

  async function askFolder(title, current, excludeIds) {
    const r = await miniDialog(`
      <form>
        <h2>${esc(title)}</h2>
        <label class="field">옮길 폴더<select name="v">${folderOptions(current, excludeIds)}</select></label>
        <div class="actions"><button type="button" class="btn" data-mini-close>취소</button><button class="btn primary">옮기기</button></div>
      </form>`);
    if (!r) return undefined;
    return r.v || null;
  }

  async function confirmBox(title, message, okLabel = '삭제', danger = true) {
    const r = await miniDialog(`
      <form>
        <h2>${esc(title)}</h2>
        <p>${message}</p>
        <div class="actions"><button type="button" class="btn" data-mini-close>취소</button><button class="btn ${danger ? 'primary' : 'primary'}" style="${danger ? 'background:var(--danger);border-color:var(--danger);color:#fff' : ''}">${esc(okLabel)}</button></div>
      </form>`);
    return !!r;
  }

  /* ---------- 누가 사용 중? ---------- */
  function renderMe() {
    $('#me').innerHTML = me ? `${avatar(me)}<span>${esc(me)}</span>` : '<span>사용자 선택</span>';
  }

  async function openWhoPicker(forced) {
    const members = state.settings.members;
    await miniDialog(`
      <form>
        <h2>누가 사용하나요?</h2>
        <p>올리거나 수정한 사람이 함께 기록됩니다. 이 기기에서는 다음부터 자동으로 선택됩니다.</p>
        <div class="people">
          ${members.map((m) => `
            <div class="person ${m === me ? 'on' : ''}" role="button" tabindex="0" data-pick="${esc(m)}">
              ${avatar(m)}<span>${esc(m)}</span>
              ${m !== me ? `<button type="button" class="rm" data-rm="${esc(m)}" title="목록에서 빼기">✕</button>` : ''}
            </div>`).join('') || '<p>아직 등록된 사람이 없습니다. 아래에 이름을 추가하세요.</p>'}
        </div>
        <div class="add-person"><input name="newname" placeholder="새 이름 추가" maxlength="20"><button type="button" class="btn" data-add>추가</button></div>
        ${forced ? '' : '<div class="actions"><button type="button" class="btn" data-mini-close>닫기</button></div>'}
      </form>`, {
      forced,
      onOpen(form, finish) {
        const pick = async (name) => {
          me = name; ls.set('sb_me', me); renderMe();
          toast(`${name}(으)로 사용합니다.`);
          finish({});
          route(false);
        };
        form.querySelector('.people').addEventListener('click', async (e) => {
          const rm = e.target.closest('[data-rm]');
          if (rm) {
            e.stopPropagation();
            if (!confirm(`'${rm.dataset.rm}'을(를) 목록에서 뺄까요? 이미 기록된 이름은 그대로 남습니다.`)) return;
            try { await saveSetting('members', state.settings.members.filter((x) => x !== rm.dataset.rm)); } catch (err) { toast(err.message, true); return; }
            finish({}); setTimeout(() => openWhoPicker(forced), 30);
            return;
          }
          const p = e.target.closest('[data-pick]');
          if (p) pick(p.dataset.pick);
        });
        form.querySelector('.people').addEventListener('keydown', (e) => {
          const p = e.target.closest('[data-pick]'); if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(p.dataset.pick); }
        });
        const add = async () => {
          const name = form.newname.value.trim();
          if (!name) { form.newname.focus(); return; }
          if (!state.settings.members.includes(name)) {
            try { await saveSetting('members', [...state.settings.members, name]); } catch (err) { toast('추가하지 못했습니다: ' + err.message, true); return; }
          }
          pick(name);
        };
        form.querySelector('[data-add]').addEventListener('click', add);
        form.newname.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
        form._result = () => false;
      }
    });
  }

  /* =========================================================
     팝업 메뉴
     ========================================================= */
  let openMenuEl = null;
  function closeMenu() { if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; } }
  function openMenu(anchor, items) {
    closeMenu();
    const m = document.createElement('div');
    m.className = 'menu';
    m.setAttribute('role', 'menu');
    m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' :
      `<button type="button" role="menuitem" data-i="${i}" class="${it.danger ? 'danger' : ''}"><span class="mi">${it.icon || ''}</span>${esc(it.label)}</button>`).join('');
    document.body.append(m);
    const r = anchor.getBoundingClientRect();
    const mw = m.offsetWidth, mh = m.offsetHeight;
    let top = r.bottom + 4 + window.scrollY;
    if (r.bottom + mh + 8 > window.innerHeight) top = r.top - mh - 4 + window.scrollY;
    m.style.top = Math.max(8, top) + 'px';
    m.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.innerWidth - mw - 8)) + 'px';
    m.addEventListener('click', (e) => {
      const b = e.target.closest('[data-i]'); if (!b) return;
      closeMenu();
      items[+b.dataset.i].run();
    });
    openMenuEl = m;
    m.querySelector('button')?.focus();
  }
  document.addEventListener('mousedown', (e) => { if (openMenuEl && !openMenuEl.contains(e.target) && !e.target.closest('.kebab, [data-act=side-add]')) closeMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

  /* =========================================================
     사이드바 트리
     ========================================================= */
  function persistExpanded() { ls.set('sb_expanded', [...state.expanded]); }

  function renderTree() {
    const activeItem = currentDetailId();
    const activeFolder = currentFolderId();
    // 현재 항목의 상위 폴더는 펼쳐두기
    if (activeItem) {
      const c = state.candidates.find((x) => x.id === activeItem);
      if (c && c.folder_id) folderPath(c.folder_id).forEach((f) => state.expanded.add(f.id));
    }
    if (activeFolder && renderTree.lastFolder !== activeFolder) folderPath(activeFolder).forEach((f) => state.expanded.add(f.id));
    renderTree.lastFolder = activeFolder;
    const rowItem = (c, depth) => `
      <div class="tree-row item ${c.id === activeItem ? 'active' : ''}" style="--depth:${depth}" draggable="true" data-type="item" data-id="${c.id}">
        <span class="twisty blank"></span>
        <span class="ico">${esc(c.emoji || '📄')}</span>
        <a class="name" href="#/c/${c.id}" title="${esc(c.title)}${c.created_by ? ' · ' + esc(c.created_by) : ''}">${esc(c.title)}</a>
        <button class="kebab" data-act="tree-menu" aria-label="메뉴">⋮</button>
      </div>`;
    const walk = (pid, depth) => {
      let html = '';
      for (const f of childFolders(pid)) {
        const open = state.expanded.has(f.id);
        const hasKids = childFolders(f.id).length || childItems(f.id).length;
        html += `
          <div class="tree-row folder ${f.id === activeFolder ? 'active' : ''}" style="--depth:${depth}" draggable="true" data-type="folder" data-id="${f.id}">
            <button class="twisty ${open ? 'open' : ''} ${hasKids ? '' : 'blank'}" data-act="toggle-folder" aria-label="${open ? '접기' : '펼치기'}">▶</button>
            <span class="ico">${esc(f.emoji || '📁')}</span>
            <a class="name" href="#/f/${f.id}">${esc(f.name)}</a>
            <span class="count">${itemsUnder(f.id).length || ''}</span>
            <button class="kebab" data-act="tree-menu" aria-label="메뉴">⋮</button>
          </div>`;
        if (open) html += walk(f.id, depth + 1);
      }
      for (const c of childItems(pid)) html += rowItem(c, depth);
      return html;
    };
    const body = walk(null, 0);
    $('#tree').innerHTML = `
      <div class="tree-row tree-all ${!activeItem && !activeFolder ? 'active' : ''}" style="--depth:0">
        <span class="twisty blank"></span><span class="ico">🗂️</span>
        <a class="name" href="#/">전체 후보</a><span class="count">${state.candidates.length}</span>
      </div>
      ${body || '<div class="tree-empty">아직 폴더나 항목이 없습니다. + 를 눌러 만들어 보세요.</div>'}
      <div class="tree-root-drop" data-root-drop>여기에 놓으면 최상위로 옮겨집니다</div>`;
  }

  // 트리 클릭
  $('#tree').addEventListener('click', (e) => {
    const row = e.target.closest('.tree-row');
    if (!row) return;
    if (e.target.closest('[data-act=toggle-folder]')) {
      const id = row.dataset.id;
      if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
      persistExpanded();
      renderTree();
      return;
    }
    if (e.target.closest('[data-act=tree-menu]')) {
      e.preventDefault();
      const btn = e.target.closest('.kebab');
      if (row.dataset.type === 'folder') folderMenu(btn, folderById(row.dataset.id));
      else itemMenu(btn, state.candidates.find((c) => c.id === row.dataset.id));
      return;
    }
    if (e.target.closest('a')) document.body.classList.remove('side-open');
  });

  function folderMenu(anchor, f) {
    if (!f) return;
    openMenu(anchor, [
      { icon: '📄', label: '이 폴더에 새 항목', run: () => openCandidateForm(null, { folderId: f.id }) },
      { icon: '📁', label: '하위 폴더 만들기', run: () => newFolder(f.id) },
      '-',
      { icon: '✏️', label: '이름 바꾸기', run: async () => {
        const name = await askText('폴더 이름 바꾸기', '폴더 이름', f.name); if (!name) return;
        await updateRow('folders', f.id, { name, ...stampUpd() }, '이름을 바꿨습니다.');
      } },
      { icon: '😀', label: '아이콘 바꾸기', run: async () => {
        const e = await askEmoji(f.emoji); if (e === undefined) return;
        await updateRow('folders', f.id, { emoji: e || null, ...stampUpd() }, '아이콘을 바꿨습니다.');
      } },
      { icon: '↪️', label: '다른 폴더로 옮기기', run: async () => {
        const to = await askFolder(`'${f.name}' 옮기기`, f.parent_id, descendantFolderIds(f.id)); if (to === undefined) return;

  async function updateRow(table, id, patch, msg) {
    await flushDoc();
    const { error } = await sb.from(table).update(patch).eq('id', id);
    if (error) { toast('저장하지 못했습니다: ' + error.message, true); return false; }
    await loadAll();
    renderTree();
    await route(false);
    if (msg) toast(msg);
    return true;

  async function newFolder(parentId) {
    const name = await askText('새 폴더', '폴더 이름', '', '예: 효리, 이번 시즌, 샘플선정');
    if (!name) return;
    const { error } = await sb.from('folders').insert({ name, parent_id: parentId || null, ...stampNew() });
    if (error) { toast('폴더를 만들지 못했습니다: ' + error.message, true); return; }
    if (parentId) state.expanded.add(parentId);
    persistExpanded();
    await loadAll();
    renderTree();
    toast(`'${name}' 폴더를 만들었습니다.`);

  async function deleteFolder(f) {
    const kids = childFolders(f.id).length, items = childItems(f.id).length;
    const parent = f.parent_id ? folderById(f.parent_id) : null;
    const where = parent ? `'${esc(parent.name)}' 폴더` : '최상위';
    const ok = await confirmBox('폴더 삭제', `'${esc(f.name)}' 폴더를 삭제할까요?${kids || items ? `<br>안에 있는 폴더 ${kids}개와 항목 ${items}개는 지워지지 않고 ${where}로 옮겨집니다.` : ''}`);
    if (!ok) return;
    const r1 = await sb.from('candidates').update({ folder_id: f.parent_id || null }).eq('folder_id', f.id);
    const r2 = await sb.from('folders').update({ parent_id: f.parent_id || null }).eq('parent_id', f.id);
    const r3 = await sb.from('folders').delete().eq('id', f.id);
    const err = r1.error || r2.error || r3.error;
    if (err) { toast('삭제하지 못했습니다: ' + err.message, true); return; }
    await loadAll();
    renderTree();
    toast('폴더를 삭제했습니다.');
    if (currentFolderId() === f.id) location.hash = f.parent_id ? '#/f/' + f.parent_id : '#/';
  }

  async function deleteCandidate(c) {
    const srcs = sourcesOf(c.id);
    const ok = await confirmBox('항목 삭제', `'${esc(c.title)}'을(를) 삭제할까요?<br>문서, 소싱처 ${srcs.length}곳, 모든 이미지가 함께 지워집니다.`);
    if (!ok) return;
    const { error } = await sb.from('candidates').delete().eq('id', c.id);
    if (error) { toast('삭제하지 못했습니다: ' + error.message, true); return; }
    if (docCtx && docCtx.id === c.id) docCtx = null;
    await removeFiles([...(c.images || []), ...srcs.flatMap((s) => s.images || []), ...docPaths(c.doc_html)]);
    await loadAll();
    renderTree();
    toast('삭제했습니다.');
    if (currentDetailId() === c.id) location.hash = c.folder_id && folderById(c.folder_id) ? '#/f/' + c.folder_id : '#/';
    else route(false);
  }

  /* ---------- 끌어서 옮기기 ---------- */
  let drag = null;
  const tree = $('#tree');
  function clearDropMarks() { $$('.drop-before, .drop-after, .drop-inside', tree).forEach((el) => el.classList.remove('drop-before', 'drop-after', 'drop-inside')); }

  tree.addEventListener('dragstart', (e) => {
    const row = e.target.closest('.tree-row[data-id]');
    if (!row) return;
    drag = { type: row.dataset.type, id: row.dataset.id };
    row.classList.add('dragging');
    document.body.classList.add('tree-dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', drag.id); } catch { /* ignore */ }
  });
  tree.addEventListener('dragend', () => {
    drag = null; clearDropMarks();
    document.body.classList.remove('tree-dragging');
    $$('.dragging', tree).forEach((el) => el.classList.remove('dragging'));
  });

  function dropPosition(e, row) {
    if (row.hasAttribute('data-root-drop')) return 'root';
    if (!row.dataset.id) return null;
    const r = row.getBoundingClientRect();
    const y = (e.clientY - r.top) / r.height;
    if (row.dataset.type === 'folder') {
      if (drag.type === 'item') return 'inside';
      if (drag.id === row.dataset.id || descendantFolderIds(drag.id).has(row.dataset.id)) return null;
      return y < 0.28 ? 'before' : y > 0.72 ? 'after' : 'inside';
    }
    if (drag.type === 'folder') return null;
    if (drag.id === row.dataset.id) return null;
    return y < 0.5 ? 'before' : 'after';
  }

  tree.addEventListener('dragover', (e) => {
    if (!drag) return;
    const row = e.target.closest('.tree-row[data-id], [data-root-drop]');
    clearDropMarks();
    if (!row) return;
    const pos = dropPosition(e, row);
    if (!pos) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    row.classList.add(pos === 'root' || pos === 'inside' ? 'drop-inside' : 'drop-' + pos);
  });

  tree.addEventListener('drop', async (e) => {
    if (!drag) return;
    const row = e.target.closest('.tree-row[data-id], [data-root-drop]');
    const pos = row && dropPosition(e, row);
    const d = drag;
    clearDropMarks();
    document.body.classList.remove('tree-dragging');
    if (!pos) return;
    e.preventDefault();
    const table = d.type === 'folder' ? 'folders' : 'candidates';
    const parentKey = d.type === 'folder' ? 'parent_id' : 'folder_id';
    let parent = null, sort = Date.now() / 1000;

    if (pos === 'root') {
      parent = null;
    } else if (pos === 'inside') {
      parent = row.dataset.id;
      state.expanded.add(parent); persistExpanded();
    } else {
      const target = d.type === 'folder' ? folderById(row.dataset.id) : state.candidates.find((c) => c.id === row.dataset.id);
      parent = d.type === 'folder' ? (target.parent_id || null) : (folderById(target.folder_id) ? target.folder_id : null);
      const sibs = (d.type === 'folder' ? childFolders(parent) : childItems(parent)).filter((x) => x.id !== d.id);
      const i = sibs.findIndex((x) => x.id === target.id);
      const so = (x) => x.sort_order ?? 0;
      if (pos === 'before') sort = i > 0 ? (so(sibs[i - 1]) + so(sibs[i])) / 2 : so(sibs[i]) - 1;
      else sort = i < sibs.length - 1 ? (so(sibs[i]) + so(sibs[i + 1])) / 2 : so(sibs[i]) + 1;
    }
    // 화면에 먼저 반영
    const obj = d.type === 'folder' ? folderById(d.id) : state.candidates.find((c) => c.id === d.id);
    if (obj) { obj[parentKey] = parent; obj.sort_order = sort; renderTree(); }
    const { error } = await sb.from(table).update({ [parentKey]: parent, sort_order: sort, ...stampUpd() }).eq('id', d.id);
    if (error) { toast('옮기지 못했습니다: ' + error.message, true); await loadAll(); renderTree(); return; }
    if (currentFolderId() || location.hash === '#/' || !location.hash) route(false);
  });

    $('#calc .chips').addEventListener('click', (e) => {

  /**
   * 폼의 위안화 입력을 계산기와 연결.
   * mode 'saved': 수정 화면에서 저장된 계산 결과를 그대로 보여줌 (다시 계산 버튼 제공)
   * mode 'live' : 입력값이 바뀌면 현재 환율·계산법으로 다시 계산
   */
  function bindPriceBox(form, row, { finalField, onLive }) {
    const input = form.querySelector('[name=cny_price]');
    const out = form.querySelector('[data-final]');
    const explain = form.querySelector('[data-explain]');
    const st = { mode: row?.applied_text ? 'saved' : 'live', result: null };
    const savedResult = row?.applied_text ? {
      final: row[finalField], rate: row.applied_rate, formula: row.applied_formula, text: row.applied_text
    } : null;

    function render() {
      const cny = decOrNull(input.value);
      if (st.mode === 'saved' && savedResult && cny === decOrNull(row.cny_price)) {
        st.result = savedResult;
        out.textContent = won(savedResult.final);
        const changed = savedResult.rate !== currentRate() || savedResult.formula !== state.settings.calc.formula;
        explain.innerHTML = `저장된 계산: ${esc(savedResult.text)}${changed ? ` <button type="button" class="btn small recalc">현재 환율·계산법으로 다시 계산</button>` : ''}`;
        return;
      }
      st.mode = 'live';
      if (cny == null) { st.result = null; out.textContent = '-'; explain.textContent = '위안화 가격을 넣으면 계산 과정과 최종금액이 여기에 나옵니다.'; return; }
      try {
        const r = calcPrice(cny);
        st.result = r;
        out.textContent = won(r.final);
        explain.textContent = '적용: ' + r.text;
        onLive && onLive(r);
      } catch (e) {
        st.result = null;
        out.textContent = '-';
        explain.innerHTML = `<span style="color:var(--danger)">${esc(e.message)}</span>`;
      }
    }
    input.addEventListener('input', () => { st.mode = 'live'; render(); });
    explain.addEventListener('click', (e) => { if (e.target.closest('.recalc')) { st.mode = 'live'; render(); } });
    const onCalc = () => { if (st.mode === 'live') render(); else render(); };
    document.addEventListener('calcchange', onCalc);
    modal.addEventListener('close', () => document.removeEventListener('calcchange', onCalc), { once: true });
    render();
    return {
      payload() {
        const cny = decOrNull(input.value);
        const r = cny == null ? null : st.result;
        return {
          cny_price: cny,
          applied_rate: r ? r.rate : null,
          applied_formula: r ? r.formula : null,
          applied_text: r ? r.text : null,
          final: r ? Math.round(r.final) : null
        };
      }
    };
  }

  /* =========================================================
     라우팅
     ========================================================= */
  function currentDetailId() { const m = location.hash.match(/^#\/c\/([\w-]+)/); return m ? m[1] : null; }
  function currentFolderId() { const m = location.hash.match(/^#\/f\/([\w-]+)/); return m ? m[1] : null; }

  async function route(scroll = true) {
    if (docCtx) await flushDoc();
    if (docCtx && (!currentDetailId() || currentDetailId() !== docCtx.id || state.tab !== 'doc')) {
      await flushDoc();
      docCtx = null;
    }
    const id = currentDetailId();
    if (id) await renderDetail(id);
    else renderList(currentFolderId());
    renderTree();
    if (scroll) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => route(true));

  /* =========================================================
     목록 (전체 / 폴더)
     ========================================================= */
  function renderList(folderId) {
    const folder = folderId ? folderById(folderId) : null;
    if (folderId && !folder) {
      view.innerHTML = `<div class="empty"><h2>폴더를 찾을 수 없습니다</h2><p>삭제되었거나 주소가 잘못되었습니다.</p><a class="btn" href="#/">전체 후보로</a></div>`;
      return;
    }
    const scope = folder ? itemsUnder(folder.id) : state.candidates;
    const counts = Object.fromEntries(STATUSES.map((s) => [s, scope.filter((c) => c.status === s).length]));
    const cats = [...new Set(scope.map((c) => c.category).filter(Boolean))].sort();
    const authors = [...new Set(scope.map((c) => c.created_by).filter(Boolean))].sort();
    if (state.category && !cats.includes(state.category)) state.category = '';
    if (state.author && !authors.includes(state.author)) state.author = '';
    const path = folder ? folderPath(folder.id) : [];

    view.innerHTML = `
      ${folder ? `<nav class="crumbs"><a href="#/">전체</a>${path.map((f) => ` / <a href="#/f/${f.id}">${esc(f.emoji || '📁')} ${esc(f.name)}</a>`).join('')}</nav>` : ''}
      <section class="list-head">
        <div>
          <h1>${folder ? `<span class="folder-emoji">${esc(folder.emoji || '📁')}</span>${esc(folder.name)}` : '신상품 후보'}</h1>
          <p>후보 ${scope.length}개 중 ${counts['선정']}개 선정${folder?.created_by ? ` · ${esc(folder.created_by)}님이 만든 폴더` : ''}</p>
        </div>
        <div class="list-actions">
          ${folder ? `<button class="btn" data-act="new-subfolder">하위 폴더</button>` : ''}
          <button class="btn primary" data-act="new-candidate">${folder ? '이 폴더에 후보 추가' : '후보 추가'}</button>
        </div>
      </section>
      <div class="toolbar">
        <div class="tabs" role="tablist">
          ${['all', ...STATUSES].map((s) => `
            <button role="tab" aria-selected="${state.status === s}" data-act="filter-status" data-v="${s}">
              ${s === 'all' ? '전체' : s}<span class="count">${s === 'all' ? scope.length : counts[s]}</span>
            </button>`).join('')}
        </div>
        <div class="filters">
          <input type="search" id="q" placeholder="상품명, 이유, 문서 내용 검색" value="${esc(state.q)}" aria-label="검색">
          <select id="author" aria-label="작성자">
            <option value="">모든 작성자</option>
            ${authors.map((a) => `<option ${a === state.author ? 'selected' : ''}>${esc(a)}</option>`).join('')}
          </select>
          <select id="cat" aria-label="카테고리">
            <option value="">모든 카테고리</option>
            ${cats.map((c) => `<option ${c === state.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
          <select id="sort" aria-label="정렬">
            <option value="new" ${state.sort === 'new' ? 'selected' : ''}>최근 추가순</option>
            <option value="updated" ${state.sort === 'updated' ? 'selected' : ''}>최근 수정순</option>
            <option value="priority" ${state.sort === 'priority' ? 'selected' : ''}>우선순위순</option>
          </select>
        </div>
      </div>
      <div id="grid"></div>`;

    $('#q').addEventListener('input', debounce((e) => { state.q = e.target.value; renderGrid(); }, 150));
    $('#author').addEventListener('change', (e) => { state.author = e.target.value; renderGrid(); });
    $('#cat').addEventListener('change', (e) => { state.category = e.target.value; renderGrid(); });
    $('#sort').addEventListener('change', (e) => { state.sort = e.target.value; renderGrid(); });
    renderGrid();
  }

  const stripTags = (html) => String(html || '').replace(/<[^>]+>/g, ' ');

  async function renderGrid() {
    const folderId = currentFolderId();
    const scope = folderId ? itemsUnder(folderId) : state.candidates;
    const q = state.q.trim().toLowerCase();
    let list = scope.filter((c) =>
      (state.status === 'all' || c.status === state.status) &&
      (!state.category || c.category === state.category) &&
      (!state.author || c.created_by === state.author) &&
      (!q || [c.title, c.category, c.reason, c.memo, c.target_customer, stripTags(c.doc_html)].join(' ').toLowerCase().includes(q)));

    if (state.sort === 'new') list = [...list].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
    if (state.sort === 'updated') list = [...list].sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)));
    if (state.sort === 'priority') list = [...list].sort((a, b) => PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority) || String(b.created_at).localeCompare(String(a.created_at)));

    const grid = $('#grid');
    if (!grid) return;

    if (!scope.length) {
      grid.innerHTML = `
        <div class="empty">
          <h2>${folderId ? '이 폴더는 비어 있습니다' : '아직 후보가 없습니다'}</h2>
          <p>들여올 만한 상품을 발견하면 후보로 추가하고, 문서에 정리하고, 소싱처 링크를 붙여 비교해 보세요.</p>
          <button class="btn primary" data-act="new-candidate">후보 추가</button>
        </div>`;
      return;
    }
    if (!list.length) {
      grid.innerHTML = `<div class="empty"><h2>조건에 맞는 후보가 없습니다</h2><p>검색어나 필터를 바꿔 보세요.</p></div>`;
      return;
    }
    await ensureUrls(list.map(coverOf));
    grid.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
  }

  function cardHTML(c) {
    const cover = coverOf(c);

          <div class="src-cards">

  /* =========================================================
     문서 편집기
     ========================================================= */
  const ALLOWED = {
    P: [], BR: [], H1: [], H2: [], H3: [], B: [], STRONG: [], I: [], EM: [], U: [], S: [], STRIKE: [], MARK: [],
    UL: ['class'], OL: [], LI: ['class'], BLOCKQUOTE: [], HR: [], A: ['href'], IMG: ['data-path', 'src', 'alt'],
    TABLE: [], THEAD: [], TBODY: [], TR: [], TD: ['colspan', 'rowspan'], TH: ['colspan', 'rowspan'], CODE: [], PRE: [], SUB: [], SUP: []
  };
  const DROP = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'TITLE', 'HEAD', 'SVG', 'MATH', 'NOSCRIPT', 'TEMPLATE', 'BUTTON', 'INPUT', 'SELECT', 'TEXTAREA', 'FORM']);
  const BLOCKISH = new Set(['DIV', 'SECTION', 'ARTICLE', 'HEADER', 'FOOTER', 'MAIN', 'ASIDE', 'NAV', 'FIGURE', 'H4', 'H5', 'H6']);

  function sanitize(html) {
    const doc = new DOMParser().parseFromString(`<body><div id="__r">${html || ''}</div></body>`, 'text/html');
    const root = doc.getElementById('__r');
    (function walk(node) {
      for (const child of [...node.childNodes]) {
        if (child.nodeType === 8) { child.remove(); continue; }
        if (child.nodeType !== 1) continue;
        let el = child;
        const tag = el.tagName;
        if (DROP.has(tag)) { el.remove(); continue; }
        if (tag === 'SPAN' || tag === 'FONT' || tag === 'LABEL' || tag === 'SMALL' || tag === 'BIG' || tag === 'CENTER' || (!ALLOWED[tag] && !BLOCKISH.has(tag))) {
          const style = el.getAttribute('style') || '';
          walk(el);
          // 굵게/기울임 스타일만 있는 span은 태그로 바꿔 보존
          const frag = doc.createDocumentFragment();
          while (el.firstChild) frag.appendChild(el.firstChild);
          let wrapped = frag;
          if (/font-weight:\s*(bold|[6-9]00)/i.test(style)) { const b = doc.createElement('b'); b.appendChild(wrapped); wrapped = b; }
          if (/font-style:\s*italic/i.test(style)) { const i = doc.createElement('i'); i.appendChild(wrapped); wrapped = i; }
          el.replaceWith(wrapped);
          continue;
        }
        if (BLOCKISH.has(tag)) {
          const p = doc.createElement(/^H[4-6]$/.test(tag) ? 'h3' : 'p');
          while (el.firstChild) p.appendChild(el.firstChild);
          el.replaceWith(p);
          el = p;
        }
        const allowed = ALLOWED[el.tagName] || [];
        for (const a of [...el.attributes]) {
          if (!allowed.includes(a.name)) { el.removeAttribute(a.name); continue; }
          if (a.name === 'href' && !/^(https?:|mailto:)/i.test(a.value.trim())) el.removeAttribute('href');
          if (a.name === 'src' && !/^https?:/i.test(a.value.trim())) el.removeAttribute('src');
          if (a.name === 'class') {
            const keep = a.value.split(/\s+/).filter((x) => x === 'checklist' || x === 'checked');
            if (keep.length) el.setAttribute('class', keep.join(' ')); else el.removeAttribute('class');
          }
        }
        if (el.tagName === 'IMG' && !el.getAttribute('data-path') && !el.getAttribute('src')) { el.remove(); continue; }
        if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
        walk(el);
      }
    })(root);
    // 블록 안에 들어간 블록(p 안의 p) 정리는 브라우저에 맡기고, 빈 p 연속은 하나로
    return root.innerHTML.replace(/(<p><\/p>){2,}/g, '<p></p>');
  }
  // A 태그의 target/rel 은 sanitize 내부에서 다시 붙이므로 허용 목록에 추가
  ALLOWED.A.push('target', 'rel');

  function serializeDoc(el) {
    const clone = el.cloneNode(true);
    clone.querySelectorAll('img.uploading').forEach((i) => i.remove());
    clone.querySelectorAll('img[data-path]').forEach((i) => i.removeAttribute('src'));
    const html = sanitize(clone.innerHTML).trim();
    return /^(<p>(<br>)?<\/p>)?$/.test(html) ? '' : html;
  }

  async function hydrateDocImages(el) {
    const imgs = [...el.querySelectorAll('img[data-path]')];
    if (!imgs.length) return;

    imgs.forEach((i) => { i.src = imgUrl(i.dataset.path); });
  }
