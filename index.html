    $('#doc-file').addEventListener('change', (e) => { insertDocImages([...e.target.files]); e.target.value = ''; });
  }
  document.addEventListener('selectionchange', () => syncBlockSelect());

  function syncBlockSelect() {
    if (!docCtx) return;
    const sel = getSelection();
    if (!sel.rangeCount || !docCtx.el.contains(sel.anchorNode)) return;
    let n = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const block = n && n.closest('h1,h2,h3,p,li,blockquote');
    const s = $('.doc-toolbar select');
    if (s && block) s.value = /^H[1-3]$/.test(block.tagName) ? block.tagName.toLowerCase() : 'p';
  }

  function rememberRange() {
    const sel = getSelection();
    if (docCtx && sel.rangeCount && docCtx.el.contains(sel.anchorNode)) docCtx.range = sel.getRangeAt(0).cloneRange();
  }
  function restoreRange() {
    if (!docCtx) return;
    docCtx.el.focus();
    const sel = getSelection();
    if (docCtx.range && docCtx.el.contains(docCtx.range.startContainer)) { sel.removeAllRanges(); sel.addRange(docCtx.range); }
    else if (!sel.rangeCount || !docCtx.el.contains(sel.anchorNode)) {
      const r = document.createRange(); r.selectNodeContents(docCtx.el); r.collapse(false);
      sel.removeAllRanges(); sel.addRange(r);
    }
  }
  function selectionBlock(selector) {
    const sel = getSelection();
    if (!sel.rangeCount) return null;
    let n = sel.anchorNode;
    n = n.nodeType === 1 ? n : n.parentElement;
    const hit = n && n.closest(selector);
    return hit && docCtx.el.contains(hit) ? hit : null;
  }

  function docCmd(cmd, val) {
    if (!docCtx) return;
    restoreRange();
    const ex = (c, v = null) => document.execCommand(c, false, v);
    switch (cmd) {
      case 'block': ex('formatBlock', `<${val}>`); break;
      case 'quote': ex('formatBlock', selectionBlock('blockquote') ? '<p>' : '<blockquote>'); break;
      case 'hr': ex('insertHorizontalRule'); break;
      case 'mark': {
        const m = selectionBlock('mark');
        if (m) { m.replaceWith(...m.childNodes); break; }
        const sel = getSelection();
        if (!sel.rangeCount || sel.isCollapsed) { toast('형광펜을 칠할 글자를 먼저 선택하세요.'); return; }
        const r = sel.getRangeAt(0);
        const mk = document.createElement('mark');
        mk.appendChild(r.extractContents());
        r.insertNode(mk);
        sel.removeAllRanges();
        break;
      }
      case 'checklist': {
        const ul = selectionBlock('ul');
        if (ul && ul.classList.contains('checklist')) { ex('insertUnorderedList'); }
        else if (ul) { ul.classList.add('checklist'); }
        else { ex('insertUnorderedList'); const nu = selectionBlock('ul'); if (nu) nu.classList.add('checklist'); }
        break;
      }
      case 'link': {
        const sel = getSelection();
        const had = sel.rangeCount && !sel.isCollapsed;
        const range = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
        askText('링크 넣기', '주소', '', 'https://').then((u) => {
          if (!u) return;
          const url = normUrl(u);
          docCtx.el.focus();
          if (range) { const s = getSelection(); s.removeAllRanges(); s.addRange(range); }
          if (had) ex('createLink', url);
          else ex('insertHTML', `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>&nbsp;`);
          markDocDirty();
        });
        return;
      }
      case 'image': rememberRange(); $('#doc-file').click(); return;
      case 'table': {
        const cells = (tag) => `<tr>${[0, 1, 2].map(() => `<${tag}><br></${tag}>`).join('')}</tr>`;
        ex('insertHTML', `<table><thead>${cells('th')}</thead><tbody>${cells('td')}${cells('td')}</tbody></table><p><br></p>`);
        break;
      }
      default: ex(cmd);
    }
    rememberRange();
    markDocDirty();
  }

  async function onDocPaste(e) {
    e.stopPropagation();
    const files = imageFilesFrom(e.clipboardData);
    if (files.length) { e.preventDefault(); insertDocImages(files); return; }
    const html = e.clipboardData.getData('text/html');
    if (html) {
      e.preventDefault();
      const clean = sanitize(html.replace(/<!--StartFragment-->|<!--EndFragment-->/g, ''));
      document.execCommand('insertHTML', false, clean);
      markDocDirty();
      importExternalImages();
    }
    // 일반 텍스트는 브라우저 기본 동작
  }

  async function insertDocImages(files, atEnd = false) {
    if (!docCtx) return;
    const ctx = docCtx;
    if (atEnd) { ctx.range = null; }
    restoreRange();
    for (const f of files) {
      const tmp = 'up' + Math.random().toString(36).slice(2);
      const local = URL.createObjectURL(f);
      document.execCommand('insertHTML', false, `<img id="${tmp}" class="uploading" src="${local}" alt="">`);
      rememberRange();
      setDocStatus('이미지 압축 중…');
      try {
        const blob = await compressImage(f);
        const path = await uploadBlob(blob);
        await ensureUrls([path]);
        const img = ctx.el.querySelector('#' + tmp);
        if (img) {
          img.src = imgUrl(path);
          img.dataset.path = path;
          img.classList.remove('uploading');
          img.removeAttribute('id');
        }
        if (docCtx === ctx) markDocDirty();
        toast(`이미지 추가됨 (${size(f.size)} → ${size(blob.size)})`);
      } catch (err) {
        ctx.el.querySelector('#' + tmp)?.remove();
        toast('이미지를 올리지 못했습니다: ' + err.message, true);
      } finally {
        URL.revokeObjectURL(local);
      }
    }
    refreshUsage();
  }

  async function importExternalImages() {
    if (!docCtx) return;
    const ctx = docCtx;
    const imgs = $$('img:not([data-path])', ctx.el).filter((i) => /^https?:/i.test(i.getAttribute('src') || ''));
    for (const img of imgs) {
      try {
        const r = await fetch(img.src, { mode: 'cors' });
        if (!r.ok) throw new Error(r.status);
        const blob = await compressImage(await r.blob());
        const path = await uploadBlob(blob);
        await ensureUrls([path]);
        img.dataset.path = path;
        img.src = imgUrl(path);
        if (docCtx === ctx) markDocDirty();
      } catch { /* 외부 주소 그대로 둠 */ }
    }
  }

  function markDocDirty() {
    if (!docCtx) return;
    docCtx.dirty = true;
    setDocStatus('수정 중…');
    clearTimeout(docCtx.timer);
    docCtx.timer = setTimeout(saveDoc, 1200);
  }

  async function flushDoc() {
    if (!docCtx) return;
    clearTimeout(docCtx.timer);
    if (docCtx.dirty) await saveDoc();
  }

  async function saveDoc() {
    const ctx = docCtx;
    if (!ctx || !ctx.dirty) return;
    if (ctx.saving) { ctx.timer = setTimeout(saveDoc, 600); return; }
    if (ctx.el.querySelector('img.uploading')) { ctx.timer = setTimeout(saveDoc, 800); return; }
    ctx.saving = true;
    ctx.dirty = false;
    setDocStatus('저장 중…');
    const html = serializeDoc(ctx.el);
    const now = new Date().toISOString();
    const { data, error } = await sb.from('candidates')
      .update({ doc_html: html, doc_rev: ctx.rev + 1, doc_updated_by: me, doc_updated_at: now, updated_by: me })
      .eq('id', ctx.id).eq('doc_rev', ctx.rev).select('id, doc_rev, updated_at');
    ctx.saving = false;
    if (error) {
      ctx.dirty = true;
      setDocStatus('저장 실패 · 다시 시도합니다', true);
      ctx.timer = setTimeout(saveDoc, 4000);
      return;
    }
    if (!data || !data.length) { await showConflict(ctx); return; }
    ctx.rev = data[0].doc_rev;
    const c = state.candidates.find((x) => x.id === ctx.id);
    if (c) Object.assign(c, { doc_html: html, doc_rev: ctx.rev, doc_updated_by: me, doc_updated_at: now, updated_by: me, updated_at: data[0].updated_at || now });
    if (docCtx === ctx) setDocStatus(`${me || ''} · ${fmtTime(now)} 저장됨`);
    if (ctx.dirty) { clearTimeout(ctx.timer); ctx.timer = setTimeout(saveDoc, 800); }
  }

  async function showConflict(ctx) {
    ctx.dirty = true;
    const { data } = await sb.from('candidates').select('doc_rev, doc_updated_by, doc_updated_at, doc_html').eq('id', ctx.id).single();
    const box = $('#doc-conflict');
    if (!box || docCtx !== ctx) return;
    setDocStatus('저장 안 됨', true);
    box.innerHTML = `
      <div class="conflict">
        ${data?.doc_updated_by ? esc(data.doc_updated_by) + '님이' : '다른 사람이'} 방금 이 문서를 수정했습니다. 내 변경 내용은 아직 저장되지 않았습니다.
        <span class="spacer"></span>
        <button class="btn small" data-conflict="theirs">최신 내용 불러오기</button>
        <button class="btn small primary" data-conflict="mine">내 내용으로 덮어쓰기</button>
      </div>`;
    box.onclick = async (e) => {
      const b = e.target.closest('[data-conflict]'); if (!b) return;
      box.innerHTML = '';
      if (b.dataset.conflict === 'mine') {
        ctx.rev = data?.doc_rev ?? ctx.rev;
        ctx.dirty = true;
        saveDoc();
      } else {
        const c = state.candidates.find((x) => x.id === ctx.id);
        if (c && data) Object.assign(c, data);
        ctx.dirty = false;
        docCtx = null;
        await renderDetail(ctx.id);
      }
    };
  }

  window.addEventListener('beforeunload', (e) => {
    if (docCtx && (docCtx.dirty || docCtx.saving)) { saveDoc(); e.preventDefault(); e.returnValue = ''; }
  });

  function openModal(html, onSubmit, uploaderPaths) {
    modal.innerHTML = html;
    const form = modal.querySelector('form');
    const upRoot = modal.querySelector('.uploader');
    activeUploader = upRoot ? createUploader(upRoot, uploaderPaths || []) : null;
    const uploader = activeUploader;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (uploader?.busy()) { toast('이미지 압축이 끝날 때까지 잠시 기다려 주세요.'); return; }
      const btn = form.querySelector('button[type=submit]');
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = '저장 중…';
      try {
        const images = uploader ? await uploader.commit() : undefined;
        await onSubmit(Object.fromEntries(new FormData(form)), images, form);
        if (uploader) await removeFiles(uploader.removed());
        closeModal();
        refreshUsage();
      } catch (err) {
        console.error(err);
        if (uploader) await removeFiles(uploader.uploaded());
        toast('저장하지 못했습니다: ' + (err.message || err), true);
        btn.disabled = false;
        btn.textContent = label;
      }
    });
    modal.showModal();
    form.querySelector('input:not([type=hidden]):not([type=checkbox]), textarea')?.focus();
    return form;
  }

        </div>
        <footer class="modal-foot">
          <span class="muted" style="font-size:13px">${me ? whoHTML(me) + (c ? ' 이름으로 수정' : ' 이름으로 등록') : ''}</span>
          <span class="spacer"></span>
          <button type="button" class="btn" data-close>취소</button>
          <button type="submit" class="btn primary">${c ? '변경 저장' : '후보 추가'}</button>
        </footer>
      </form>`,
    async (f, images) => {
      if (!f.title?.trim()) throw new Error('상품명을 입력해 주세요.');
      const p = price.payload();
      const payload = {
        title: f.title.trim(), emoji: f.emoji || null, folder_id: f.folder_id || null,
        category: f.category.trim() || null, status: f.status, priority: f.priority,
        target_price: numOrNull(f.target_price), reason: f.reason || null, target_customer: f.target_customer || null,
        risks: f.risks || null, memo: f.memo || null, images,
        cny_price: p.cny_price, applied_rate: p.applied_rate, applied_formula: p.applied_formula, applied_text: p.applied_text
      };
      if (c) {
        if (c.folder_id !== payload.folder_id) payload.sort_order = Date.now() / 1000;
        const { error } = await sb.from('candidates').update({ ...payload, ...stampUpd() }).eq('id', c.id);
        if (error) throw error;
        await loadAll();
        toast('변경 내용을 저장했습니다.');
        await route(false);
      } else {
        const { data, error } = await sb.from('candidates').insert({ ...payload, ...stampNew() }).select().single();
        if (error) throw error;
        if (payload.folder_id) { state.expanded.add(payload.folder_id); persistExpanded(); }
        await loadAll();
        toast('후보를 추가했습니다. 문서 탭에 자유롭게 정리해 보세요.');
        state.tab = 'doc'; ls.set('sb_tab', 'doc');
        location.hash = '#/c/' + data.id;
      }
    }, c?.images);

    const tp = form.querySelector('[name=target_price]');
    tp.addEventListener('input', () => { tp.dataset.manual = '1'; });
    const price = bindPriceBox(form, c, {
      finalField: 'target_price',
      onLive: (r) => { if (!tp.dataset.manual || !tp.value) { tp.value = Math.round(r.final); tp.dataset.manual = ''; } }
    });
    form.querySelector('[data-pick-emoji]').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const em = await askEmoji(form.emoji.value);
      if (em === undefined) return;
      form.emoji.value = em;
      btn.textContent = em || '📄';
    });
  }

  /* ---------- 소싱처 폼 ---------- */
  function openSourceForm(candidateId, s) {
    const v = (k) => esc(s?.[k] ?? '');
    const form = openModal(`
      <form novalidate>
        <header class="modal-head">
          <h2>${s ? '소싱처 수정' : '소싱처 추가'}</h2>
          <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button>
        </header>
        <div class="modal-body">
          <label>상품 링크 <small>붙여넣으면 사이트를 자동으로 채웁니다</small>
            <input name="url" value="${v('url')}" placeholder="https://detail.1688.com/offer/..." autocomplete="off"></label>
          <div class="row2">
            <label>판매처 상품명 <input name="product_name" value="${v('product_name')}"></label>
            <label>사이트 <input name="site" list="site-list" value="${v('site')}" required placeholder="예: 1688">
              <datalist id="site-list">${SITES.map((x) => `<option value="${x}">`).join('')}</datalist></label>
          </div>
          ${priceBoxHTML(s, '최종금액')}
          <div class="row4">
            <label>단가 <small>원 · 위안×환율 자동</small><input name="unit_price" inputmode="numeric" value="${s?.unit_price ?? ''}" placeholder="2400"></label>
            <label>배송비 <small>개당 원</small><input name="shipping_fee" inputmode="numeric" value="${s?.shipping_fee ?? ''}" placeholder="1200"></label>
            <label>MOQ <small>최소 수량</small><input name="moq" inputmode="numeric" value="${s?.moq ?? ''}"></label>
            <label>배송 기간 <small>일</small><input name="lead_days" inputmode="numeric" value="${s?.lead_days ?? ''}"></label>
          </div>
          <label>평점 · 후기 <input name="rating" value="${v('rating')}" placeholder="예: 4.8점, 후기 1,200개"></label>
          <div class="row2" style="grid-template-columns:1fr 1fr">
            <label>장점 <textarea name="pros" rows="3">${v('pros')}</textarea></label>
            <label>단점 <textarea name="cons" rows="3">${v('cons')}</textarea></label>
          </div>
          <label>메모 <textarea name="memo" rows="2" placeholder="옵션, 색상, 샘플 주문 여부 등">${v('memo')}</textarea></label>
          <div class="field">이미지 <div class="uploader"></div></div>
          <label class="check"><input type="checkbox" name="is_selected" ${s?.is_selected ? 'checked' : ''}> 이 소싱처를 최종 선택으로 지정</label>
        </div>
        <footer class="modal-foot">
          ${s ? '<button type="button" class="btn ghost danger" data-del-source>삭제</button>' : ''}
          <span class="muted" style="font-size:13px">${me ? whoHTML(me) + (s ? ' 이름으로 수정' : ' 이름으로 등록') : ''}</span>
          <span class="spacer"></span>
          <button type="button" class="btn" data-close>취소</button>
          <button type="submit" class="btn primary">${s ? '변경 저장' : '소싱처 추가'}</button>
        </footer>
      </form>`,
    async (f, images) => {
      const url = normUrl(f.url);
      const site = (f.site || '').trim() || guessSite(url || '') || '기타';
      const p = price.payload();
      const payload = {
        candidate_id: candidateId, site, url, product_name: f.product_name || null,
        unit_price: numOrNull(f.unit_price), shipping_fee: numOrNull(f.shipping_fee),
        moq: numOrNull(f.moq), lead_days: numOrNull(f.lead_days), rating: f.rating || null,
        pros: f.pros || null, cons: f.cons || null, memo: f.memo || null,
        is_selected: f.is_selected === 'on', images,
        cny_price: p.cny_price, final_price: p.final, applied_rate: p.applied_rate, applied_formula: p.applied_formula, applied_text: p.applied_text
      };
      let savedId = s?.id;
      if (s) {
        const { error } = await sb.from('sources').update({ ...payload, ...stampUpd() }).eq('id', s.id);
        if (error) throw error;
      } else {
        const { data, error } = await sb.from('sources').insert({ ...payload, ...stampNew() }).select().single();
        if (error) throw error;
        savedId = data.id;
      }
      if (payload.is_selected) {
        await sb.from('sources').update({ is_selected: false }).eq('candidate_id', candidateId).neq('id', savedId);
      }
      await loadAll();
      toast(s ? '소싱처를 저장했습니다.' : '소싱처를 추가했습니다.');
      state.tab = 'sources';
      await route(false);
    }, s?.images);

    const unit = form.querySelector('[name=unit_price]');
    unit.addEventListener('input', () => { unit.dataset.manual = '1'; });
    const price = bindPriceBox(form, s, {
      finalField: 'final_price',
      onLive: (r) => { if (!unit.dataset.manual || !unit.value) { unit.value = r.krw; unit.dataset.manual = ''; } }
    });

    const urlInput = form.querySelector('input[name=url]');
    const siteInput = form.querySelector('input[name=site]');
    urlInput.addEventListener('input', () => {
      const g = guessSite(normUrl(urlInput.value) || '');
      if (g && (!siteInput.value || siteInput.dataset.auto === '1')) { siteInput.value = g; siteInput.dataset.auto = '1'; }
    });
    siteInput.addEventListener('input', () => { siteInput.dataset.auto = '0'; });

    const del = form.querySelector('[data-del-source]');
    if (del) del.addEventListener('click', async () => {
      const ok = await confirmBox('소싱처 삭제', `'${esc(s.site)}' 소싱처를 삭제할까요? 첨부 이미지도 함께 지워집니다.`);
      if (!ok) return;
      const { error } = await sb.from('sources').delete().eq('id', s.id);
      if (error) { toast('삭제하지 못했습니다: ' + error.message, true); return; }
      await removeFiles(s.images);
      closeModal();
      await loadAll();
      toast('소싱처를 삭제했습니다.');
      await route(false);
    });
  }

  /* =========================================================
     라이트박스
     ========================================================= */
  const lb = { paths: [], i: 0 };
  function renderLightbox() {
    const p = lb.paths[lb.i];
    const many = lb.paths.length > 1;
    lightbox.innerHTML = `
      <div class="lb">
        <img src="${esc(imgUrl(p))}" alt="">
        <div class="lb-bar">
          <span>${lb.i + 1} / ${lb.paths.length}</span>
          <span class="spacer"></span>
          <button class="btn small" data-act="copy-image" data-path="${esc(p)}">이미지 복사</button>
          <a class="btn small" href="${esc(imgUrl(p))}" target="_blank" rel="noopener">새 탭에서 열기</a>
          <button class="btn small" data-act="lb-close">닫기</button>
        </div>
        ${many ? `<button class="lb-nav prev" data-act="lb-prev" aria-label="이전">‹</button><button class="lb-nav next" data-act="lb-next" aria-label="다음">›</button>` : ''}
      </div>`;
  }
  function lbMove(d) { lb.i = (lb.i + d + lb.paths.length) % lb.paths.length; renderLightbox(); }
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox || e.target.classList.contains('lb')) lightbox.close(); });
  lightbox.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') lbMove(-1);
    if (e.key === 'ArrowRight') lbMove(1);
  });

  /* =========================================================
     클릭 이벤트 (위임)
     ========================================================= */
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const id = currentDetailId();
    const c = id ? state.candidates.find((x) => x.id === id) : null;

    switch (act) {
      case 'logout': await flushDoc(); await sb.auth.signOut(); break;
      case 'me': openWhoPicker(false); break;
      case 'side-toggle': document.body.classList.toggle('side-open'); break;
      case 'calc-toggle': setCalcOpen(!document.body.classList.contains('calc-open')); break;
      case 'calc-close': setCalcOpen(false); break;
      case 'rate-refresh': fetchRate(true); toast('환율을 다시 불러옵니다.'); break;
      case 'calc-save': saveCalcFormula(); break;
      case 'calc-reset':
        $('#calc-formula').value = DEFAULT_CALC.formula;
        $('#calc-unit').value = String(DEFAULT_CALC.round_unit);
        $('#calc-mode').value = DEFAULT_CALC.round_mode;
        $('#calc-formula').dispatchEvent(new Event('input'));
        toast('기본 계산법을 불러왔습니다. 저장을 눌러야 적용됩니다.');
        break;
      case 'copy-final':
        navigator.clipboard?.writeText(String(el.dataset.v)).then(() => toast(`${fmtNum(el.dataset.v, 0)} 을(를) 복사했습니다.`));
        break;
      case 'filter-status':
        state.status = el.dataset.v;
        $$('.tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.v === state.status));
        renderGrid();
        break;
      case 'new-candidate': openCandidateForm(null, { folderId: currentFolderId() }); break;
      case 'new-subfolder': newFolder(currentFolderId()); break;
      case 'edit-candidate': if (c) openCandidateForm(c); break;
      case 'item-emoji': {
        if (!c) break;
        const em = await askEmoji(c.emoji); if (em === undefined) break;
        await flushDoc();
        await updateRow('candidates', c.id, { emoji: em || null, ...stampUpd() });
        break;
      }
      case 'item-more': if (c) itemMenu(el, c); break;
      case 'tab':
        await flushDoc();
        docCtx = null;
        state.tab = el.dataset.v; ls.set('sb_tab', state.tab);
        if (c) await renderDetail(c.id);
        break;
      case 'new-source': if (c) openSourceForm(c.id, null); break;
      case 'edit-source': {
        const s = state.sources.find((x) => x.id === el.dataset.id);
        if (s) openSourceForm(s.candidate_id, s);
        break;
      }
      case 'toggle-select': {
        const s = state.sources.find((x) => x.id === el.dataset.id);
        if (!s) break;
        const next = !s.is_selected;
        if (next) await sb.from('sources').update({ is_selected: false }).eq('candidate_id', s.candidate_id).neq('id', s.id);
        const { error } = await sb.from('sources').update({ is_selected: next, ...stampUpd() }).eq('id', s.id);
        if (error) { toast('바꾸지 못했습니다: ' + error.message, true); break; }
        await loadAll();
        toast(next ? `'${s.site}'을(를) 최종 선택했습니다.` : '최종 선택을 해제했습니다.');
        await renderDetail(s.candidate_id);
        break;
      }
      case 'copy-image':
        e.preventDefault(); e.stopPropagation();
        copyImage(el.dataset.path);
        break;
      case 'open-lightbox':
        lb.paths = JSON.parse(el.dataset.set);
        lb.i = +el.dataset.i;
        renderLightbox();
        lightbox.showModal();
        break;
      case 'lb-prev': lbMove(-1); break;
      case 'lb-next': lbMove(1); break;
      case 'lb-close': lightbox.close(); break;
    }
  });

  document.addEventListener('change', async (e) => {
    if (e.target.dataset.act !== 'quick-status') return;
    const id = currentDetailId();
    const status = e.target.value;
    await flushDoc();
    const { error } = await sb.from('candidates').update({ status, ...stampUpd() }).eq('id', id);
    if (error) { toast('상태를 바꾸지 못했습니다: ' + error.message, true); return; }
    const c = state.candidates.find((x) => x.id === id);
    if (c) { c.status = status; c.updated_by = me; c.updated_at = new Date().toISOString(); }
    toast(`상태를 '${status}'(으)로 바꿨습니다.`);
    if (state.tab === 'doc') {
      // 문서 편집 중에는 편집기를 다시 그리지 않고 표시만 바꿈
      const pill = $('.detail-head .pill');
      if (pill) { pill.className = `pill s-${STATUS_KEY[status]}`; pill.textContent = status; }
    } else await renderDetail(id);
  });

  // 다른 팀원이 바꾼 내용: 창으로 돌아오면 새로 불러오기
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || $('#app').hidden || modal.open || mini.open) return;
    if (docCtx && (docCtx.dirty || docCtx.saving)) return;
    const prevRev = docCtx ? docCtx.rev : null;
    const prevCalc = JSON.stringify(state.settings.calc);
    const ok = await loadAll();
    if (!ok) return;
    renderTree();
    if (JSON.stringify(state.settings.calc) !== prevCalc) { renderCalcPanel(); document.dispatchEvent(new CustomEvent('calcchange')); }
    if (docCtx) {
      const c = state.candidates.find((x) => x.id === docCtx.id);
      if (c && c.doc_rev !== prevRev && !docCtx.dirty) { docCtx = null; await renderDetail(c.id); }
    } else {
      route(false);
    }
  });

  /* =========================================================
     시작
     ========================================================= */
  (async () => {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session) startApp(); else showLogin();
    } catch (err) {
      window.__bootFail('Supabase에 연결하지 못했습니다: ' + err.message + ' (설정의 URL과 키를 확인하세요)');
    }
  })();
  setInterval(() => { if (!$('#app').hidden) fetchRate(true); }, 30 * 60 * 1000);
})();

  </script>
</body>
</html>
